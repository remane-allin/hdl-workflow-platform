raw_request: "第一问那个MR 应该是软件复位和硬件复位的问题，他们共用一个引脚，你看着处理"
normalized_requirement: "The HI-3593 Loop1 top shall expose only one external reset pin, MR. Board-level hardware reset and any platform software-driven reset shall share that same MR pin. SPI opcode 0x04 is an internal software-controlled master-reset request with the same architectural reset effects as MR, but it shall not create a second top-level reset pin. SPI opcode 0x44 remains the distinct FIFO/mailbox-only Software Reset."
affected_requirements:
  - REQ-RST-001
  - REQ-RST-002
acceptance_notes:
  - RTL top interface has MR only; no separate hard_reset, soft_reset, or sw_reset top-level input.
  - reset_clock_ctrl merges MR and opcode 0x04 into the master reset route.
  - opcode 0x44 is implemented as FIFO/mailbox-only clear and does not drive the MR pin.
