schema_version: 1
mode: ps_pl
board: navigator_zynq_7020
rtl_top_module: hi3593_v2_proto_top
bd_name: ps_pl_system
fclk_mhz: 100
axi_regions:
  pl_ctrl:
    base: 0x43C00000
    range: 64K
    instance: hi3593_v2_proto_top_0
    slave_interface: s00_axi
ddr_regions:
  ps_ddr:
    base: 0x00100000
    size: 0x3FF00000
  test_window:
    base: 0x01000000
    size: 4
cache_policy:
  flush_after_ps_write: true
  invalidate_before_ps_read: true
  document_cache_lines: true
external_stimulus_policy:
  ps_pl_bus_stimulus_owner: ps_software_or_testbench
  rtl_must_not_format_uart_messages: true
  rtl_must_not_model_ps_ddr_timers: true
  hi8450_not_ready_policy: use PS-controlled digital RX drive register for OUTA/OUTB-equivalent timing into the v2 top
  tx_boundary_observation_policy: sample actual TX1IN/TX0IN/SLP levels with timestamps and decode them in Vitis/report tooling
serial_console:
  active_console: ps_uart0
  base: STDIN_BASEADDRESS
  physical_path: "PS UART0 MIO 14..15 / COM3"
  baud: 115200
  role: "Automated Loop3 board-control command/response evidence."
  pl_uartlite_role: "Optional PL serial peripheral in the BD; not used as the active COM3 console."
external_boundary:
  required_external_interfaces:
    - name: HI8450_receiver_logic
      pins:
        - OUT1A
        - OUT1B
        - OUT2A
        - OUT2B
      real_external_source_available: false
      fallback_mode: ps_software_emulation
      verification_claim: emulated_only
    - name: HI8592_driver_logic
      pins:
        - TX1IN
        - TX0IN
        - SLP
      real_external_receiver_available: false
      fallback_mode: pl_sampler_readback
      verification_claim: sampled_only
validation_modes:
  ip_level:
    required: true
    status: planned
  ps_pl_emulation:
    required: true
    status: planned
  pin_level_external:
    required: true
    status: deferred
    defer_reason: external ARINC analog source or receiver not available
claim_policy:
  may_claim_fpga_bringup: true
  may_claim_ps_pl_runtime_path: true
  may_claim_external_pin_level_validation: false
  may_claim_full_hardware_validation: false
ps_mio_assignments:
  ps_key0: PS_KEY0
  ps_led1: PS_LED1
pl_port_assignments:
  pl_led0: PL_LED0
  sys_clk: PL_GCLK_50MHZ
  uart_rx: UART3_RX
  uart_tx: UART3_TX
bd_external_ports:
  sys_clk:
    direction: I
    bd_pin: sys_clk
  uart_rx:
    direction: I
    bd_pin: uart_rx
  uart_tx:
    direction: O
    bd_pin: uart_tx
  pl_led0:
    direction: O
    bd_pin: pl_led0
toolchain_reference:
  vivado_launcher: vivado_bat
  xsct_launcher: xsct_bat
  vitis_launcher: vitis_bat
  bootgen_launcher: bootgen_bat
  source: env/rule/global/toolchains/toolchains.yaml
expected_board_checks:
  -
    name: ps_pl_axi_register_readback
    expected: PS reads CONTROL, STATUS, TX_SAMPLE, RX_DRIVE, and ID through the AXI4-Lite aperture and all required values are coherent
    type: automated_serial
    blocking: true
    marker: LOOP3_CHECK id_readback PASS
  -
    name: spi_opcode_sequence
    expected: PS bit-bangs the signed core SPI pins through CONTROL and observes FIFO/status effects for TX FIFO write, TX start, FIFO reset, and master reset opcodes
    type: automated_serial
    blocking: true
    markers:
      - "OPCODE[0C] write_tx_fifo PASS"
      - "OPCODE[40] tx_start PASS"
      - "OPCODE[44] fifo_mailbox_reset PASS"
      - "OPCODE[04] master_reset PASS"
  -
    name: tx_boundary_sampler_decode
    expected: TX1IN/TX0IN/SLP sampled actual levels decode to the Vitis-driven ARINC word with correct rate, parity, and null gap
    type: automated_serial
    blocking: true
    marker: LOOP3_CHECK tx_boundary_sampler_decode PASS
  -
    name: rx_symbol_injection_readback
    expected: RX digital drive register drives OUTA/OUTB-equivalent timing and SPI RX FIFO/status readback matches the driven word acceptance boundary
    type: automated_serial
    blocking: true
    marker: LOOP3_CHECK rx_symbol_injection_readback PASS
  -
    name: ps_ddr_cache_window
    expected: PS writes, flushes, invalidates, and reads the configured DDR test window without data corruption
    type: automated_serial
    blocking: true
    marker: LOOP3_CHECK ps_ddr_test_window PASS
  -
    name: analog_boundary_deferred
    expected: HI-8592 analog voltage/slew and HI-8450 threshold checks are not claimed until the devices and instruments are available
    type: human_observation
    blocking: false
    marker: LOOP3_CHECK analog_boundary DEFERRED
release_waivers:
  vivado_drc:
    - id: PDRC-153
      rationale: PS-controlled SPI bit-bang SCK and CS frame-reset behavior is intentionally preserved for Loop3 bring-up after Loop1 regression showed a minimal latch cleanup breaks the signed SPI contract.
      evidence: work/gates/reentry_issue_log.md
  timing_methodology:
    - id: no_input_delay
      rationale: post_impl_timing_summary.rpt reports checking no_input_delay (0); the release gate currently matches the heading string instead of the zero violation count.
      evidence: output/fpga/vivado/reports/post_impl_timing_summary.rpt
    - id: no_output_delay
      rationale: post_impl_timing_summary.rpt reports checking no_output_delay (0); the release gate currently matches the heading string instead of the zero violation count.
      evidence: output/fpga/vivado/reports/post_impl_timing_summary.rpt
