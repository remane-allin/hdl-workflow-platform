schema_version: 1
project: Hi3593_v2
template_type: architecture_supplement
intake_target: work/docparse/frontdoor/intake/pending
required_fields:
  - supplement_id
  - source_requirement_ids
  - rule_text
  - applies_to
  - module_plan_changes
  - interface_contract_changes
  - forbidden_design_impacts
  - blocking
  - documents_to_update
  - gates_to_update
  - approval_status
example:
  supplement_id: ARCH-SUP-001
  source_requirement_ids:
    - REQ-NEW-001
  rule_text: Architecture rule or partitioning decision.
  applies_to:
    - work/docparse/architecture/module_plan.yaml
  module_plan_changes:
    - Add/modify module ownership and interfaces.
  interface_contract_changes:
    - "Signal, timing, or register contract updates."
  forbidden_design_impacts:
    - No event-level injection or accept-all shortcut.
  blocking: true
  documents_to_update:
    - output/docs/design/microarchitecture_spec.md
  gates_to_update:
    - docparse
    - loop1
  approval_status: pending
