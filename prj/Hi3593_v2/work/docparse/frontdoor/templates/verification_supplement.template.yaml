schema_version: 1
project: Hi3593_v2
template_type: verification_supplement
intake_target: work/docparse/frontdoor/intake/pending
required_fields:
  - supplement_id
  - requirement_ids
  - test_tasks
  - task_packaging
  - expected_model
  - required_signals
  - vcd_parser
  - uvm_obligations
  - coverage_obligations
  - final_verdict_rule
  - approval_status
example:
  supplement_id: VERIF-SUP-001
  requirement_ids:
    - REQ-NEW-001
  test_tasks:
    - tb_task_name_bound_to_requirement
  task_packaging: "Each task emits HDLFLOW|TEST_BEGIN, HDLFLOW|CHECK, and HDLFLOW|SUMMARY evidence."
  expected_model: "Spec-derived expected behavior, not DUT echo."
  required_signals:
    - top.input_signal
    - top.output_signal
  vcd_parser: loop1-waveform-gate must sample required_signals and fail missing/incorrect transitions.
  uvm_obligations:
    - monitor observed transactions
    - scoreboard independent expected model
  coverage_obligations:
    - functional coverpoint or code coverage target
  final_verdict_rule: TB PASS and VCD FAIL means final Loop1 result FAIL.
  approval_status: pending
