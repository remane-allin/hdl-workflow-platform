schema_version: 1
project: Hi3593_v2
template_type: new_requirement
intake_target: work/docparse/frontdoor/intake/pending
merge_policy: "approved request must merge into generated active_srs, design, verification, prototype, and trace baselines before execution"
required_fields:
  - id
  - request_type
  - source_refs
  - requirement_text
  - rationale
  - acceptance_criteria
  - affected_modules
  - affected_interfaces
  - design_obligations
  - verification_obligations
  - prototype_obligations
  - trace_links
  - impacted_documents
  - risk_impact
  - approval_status
  - merge_status
example:
  id: REQ-NEW-001
  request_type: new_requirement
  source_refs:
    - input/spec/user_request.md
  owner_role: spec
  requirement_text: The design shall implement the requested observable behavior.
  rationale: "Record why this is a product requirement, not an implementation guess."
  priority: must
  acceptance_criteria:
    -
      id: AC-REQ-NEW-001
      text: Observable pass/fail condition tied to the requirement.
      verification_method: loop1_directed_tb_or_loop2_uvm
  affected_modules:
    - module_or_new_module_name
  affected_interfaces:
    - top_or_bus_signal_name
  affected_registers: []
  design_obligations:
    - Update module_plan/dataflow/interface_contracts when approved.
  verification_obligations:
    - Create task-bound Loop1 checks and UVM coverage/scoreboard intent.
  prototype_obligations:
    - State whether Loop3 evidence is required or explicitly not applicable.
  trace_links:
    -
      requirement_id: REQ-NEW-001
      design_intent: work/docparse/architecture/module_plan.yaml
      verification_intent: work/docparse/verification/verification_plan.yaml
      prototype_intent: work/docparse/prototype/prototype_plan.yaml
  impacted_documents:
    - work/docparse/frontdoor/generated/active_srs.generated.yaml
    - work/docparse/frontdoor/generated/active_design_intent.generated.yaml
    - work/docparse/frontdoor/generated/active_verification_intent.generated.yaml
    - work/docparse/frontdoor/generated/active_trace_matrix.generated.yaml
  risk_impact: "List compatibility, timing, protocol, coverage, and claim risks."
  approval_status: pending
  merge_status: not_merged
