schema_version: 1
project: Hi3593_v2
status: READY
owner_role: spec
source_refs:
  - input/spec/Holtic-HI-3593.pdf
  - input/spec/hi-8450_v-rev-b.pdf
  - input/spec/hi-8592_v-rev-j.pdf
  - input/spec/chat_request_mr_shared_reset_pin.yaml
functional_requirements:
  - REQ-SPI-001
  - REQ-SPI-002
  - REQ-RST-001
  - REQ-RST-002
  - REQ-FIFO-001
  - REQ-ARINC-001
  - REQ-RX-001
  - REQ-TX-001
  - REQ-STATUS-001
  - REQ-PROTO-001
non_functional_requirements:
  - ASM-BOUNDARY-001
requirements:
  - id: REQ-SPI-001
    priority: must
    text: "The design shall implement HI-3593 SPI mode 0 command framing with CS active low, 8-bit MSB-first command bytes, SI sampled on SCK rising edges, SO updated on SCK falling edges, and incomplete bytes discarded when CS returns inactive."
    evidence_refs:
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:315
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:325
  - id: REQ-SPI-002
    priority: must
    text: "The design shall decode the HI-3593 command set needed for control register access, TX FIFO write, RX FIFO read, label memory load, priority-label register access, status reads, master reset 0x04, transmit-enable 0x40, and FIFO/mailbox software reset 0x44."
    evidence_refs:
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:56
  - id: REQ-RST-001
    priority: must
    text: "The top-level hardware reset boundary shall expose one external reset pin named MR; board hardware reset and platform software-driven reset share that MR pin, while SPI opcode 0x04 creates an internal master-reset request with the same architectural effects and no second top-level reset pin."
    evidence_refs:
      - input/spec/chat_request_mr_shared_reset_pin.yaml
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:303
  - id: REQ-RST-002
    priority: must
    text: "SPI opcode 0x44 shall clear TX/RX FIFOs and priority-label registers only, leaving ordinary control registers unaffected."
    evidence_refs:
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:307
  - id: REQ-FIFO-001
    priority: must
    text: "The transmit path shall provide a 32 by 32-bit FIFO that ignores writes while full, and each receive path shall provide a 32 by 32-bit FIFO whose location 32 is overwritten when a new accepted word arrives while full."
    evidence_refs:
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:229
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:241
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:269
  - id: REQ-ARINC-001
    priority: must
    text: "The ARINC 429 digital path shall operate on 32-bit words, support high-speed and low-speed timing classes, preserve ARINC label bit ordering, and support optional parity generation/checking for bit 32."
    evidence_refs:
      - work/docparse/parsed/mineru_extract/ARINC-429_protocol_spec.md:119
      - work/docparse/parsed/mineru_extract/ARINC-429_protocol_spec.md:179
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:253
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:259
  - id: REQ-RX-001
    priority: must
    text: "Each receiver shall accept decoded ONE/ZERO/NULL logic from an external ARINC receiver boundary, apply SDI, parity, label-memory, and priority-label filtering, and update FIFO/status/mailbox outputs from accepted words."
    evidence_refs:
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:66
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:211
      - work/docparse/parsed/mineru_extract/hi-8450_v-rev-b.md:7
      - work/docparse/parsed/mineru_extract/hi-8450_v-rev-b.md:37
  - id: REQ-TX-001
    priority: must
    text: "The transmitter shall load 32-bit words through SPI opcode 0x0C, send immediately when TMODE is set or after opcode 0x40 when TMODE is clear, insert parity when enabled, and force the external driver control to NULL during self-test."
    evidence_refs:
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:73
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:251
      - work/docparse/parsed/mineru_extract/hi-8592_v-rev-j.md:49
  - id: REQ-STATUS-001
    priority: should
    text: "The design shall expose FIFO empty/half/full status and programmable receiver flag/interrupt indications needed for host polling and directed verification."
    evidence_refs:
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:79
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:86
      - work/docparse/parsed/mineru_extract/Holtic-HI-3593.md:93
  - id: REQ-PROTO-001
    priority: must
    text: "FPGA prototype verification shall cover IP-level and PS/PL-controlled digital interfaces while explicitly downgrading external analog pin-level and full hardware validation claims unless separate board evidence exists."
    evidence_refs:
      - work/docparse/parsed/mineru_extract/hi-8450_v-rev-b.md:84
      - work/docparse/parsed/mineru_extract/hi-8592_v-rev-j.md:101
assumptions:
  - id: ASM-BOUNDARY-001
    text: "Analog voltage, slew, lightning, and DC/DC behavior of HI-8450/HI-8592/HI-3593 line circuits are outside synthesizable RTL and require external board evidence."
