old_text: "The approved baseline covers a reduced opcode matrix and a coarse RX/TX/status model."
new_text: "The active baseline shall cover the HI-3593 digital functional surface defined by the datasheet instruction table, control/status registers, label recognition memories, priority-label match/mailbox registers, receiver flag/interrupt assignment, ACLK division register, TX/RX FIFO behavior, TX parity/rate/self-test/HIZ behavior, and RX SDI/parity/label/priority filtering. Analog voltage, slew, DC/DC converter, package, and line-protection behavior remain outside synthesizable RTL and require external board evidence."
reason: "The previous active baseline and implementation passed Loop3 for a reduced PS/PL path but did not implement or verify all datasheet-defined HI-3593 digital functions."
