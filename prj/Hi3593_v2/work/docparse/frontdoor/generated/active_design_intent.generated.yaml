design_obligations:
  - id: DI-TOP-001
    text: "hi3593_v2_top is hierarchy-only and exposes official SPI/reset, mailbox/status, and digital ARINC boundary signals."
  - id: DI-SPI-001
    text: "spi_slave_if owns SPI byte framing and SCK-domain command request hold; spi_cmd_cdc owns the SCK-to-ACLK command and readback handshake."
  - id: DI-REG-001
    text: "control_status_regs owns control/status registers, reset effects, label memories, priority-label match registers, mailbox clear pulses, FIFO commands, flag/interrupt assignment registers, and readback muxing."
  - id: DI-FIFO-001
    text: "sync_fifo is the single reusable 32x32 FIFO primitive for TX and both RX paths, with TX ignore-on-full and RX overwrite-location-32 policies."
  - id: DI-ARINC-001
    text: "arinc429_tx and arinc429_rx own ARINC digital word timing, parity, label bit ordering, SDI, label, priority, and rate datapaths."
  - id: DI-MAILBOX-001
    text: "rx_mailbox_status stores RX priority-label bytes 2..4 in three mailbox slots per receiver, exposes MB/flag/interrupt outputs, and clears mailbox-valid state on mailbox reads or software reset."
  - id: DI-PROTO-AXI-001
    text: "hi3593_v2_proto_top is a Loop3-only PS/PL AXI4-Lite adapter that bit-bangs the signed SPI boundary, samples digital TX pins, drives RX digital inputs, exposes mailbox/status samples, and does not replace core protocol behavior."
assumptions:
  - ASM-BOUNDARY-001
