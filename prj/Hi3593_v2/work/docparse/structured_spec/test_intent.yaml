functional_tests:
  - id: T-SPI-PARTIAL
    requirement_id: REQ-SPI-001
    stimulus: "Assert CS, send fewer than 8 SCK rising edges, deassert CS, then verify no command side effect."
    expected: "partial transfer discarded"
  - id: T-OPCODE-FULL
    requirement_id: REQ-INST-001
    stimulus: "Exercise every defined HI-3593 opcode from Table 1, including no-op, register, FIFO, label memory, priority-label, mailbox, status, ACLK, reset, and transmit-enable commands."
    expected: "each supported command returns the documented side effect or read data; no-op/reserved commands do not mutate state"
  - id: T-MR-SHARED
    requirement_id: REQ-RST-001
    stimulus: "Pulse MR and execute opcode_04 after non-default register/FIFO/label/priority state."
    expected: "same master reset state and no second top-level reset signal"
  - id: T-SWRESET-44
    requirement_id: REQ-RST-002
    stimulus: "Write control registers, label memories, priority labels, and FIFOs, then execute opcode_44."
    expected: "FIFO, priority-label match registers, and priority mailboxes clear while ordinary control and label memory remain unchanged"
  - id: T-LABEL-MEMORY
    requirement_id: REQ-LABEL-001
    stimulus: "Write/read/set-all receiver label memories and inject accepted/rejected labels."
    expected: "256-bit label maps read back and LABREC gates RX FIFO acceptance"
  - id: T-PRIORITY-MAILBOX
    requirement_id: REQ-MAILBOX-001
    stimulus: "Program three priority labels per receiver, enable PLON, inject matching labels, and read mailbox opcodes."
    expected: "mailbox valid pins/status bits assert and mailbox read data matches ARINC bytes 2..4"
  - id: T-FLAG-INT
    requirement_id: REQ-FLAGINT-001
    stimulus: "Program flag/interrupt assignment modes and generate FIFO/mailbox events."
    expected: "R1FLAG/R2FLAG/R1INT/R2INT follow selected source modes"
  - id: T-TX-FULL
    requirement_id: REQ-TX-FULL-001
    stimulus: "Exercise TMODE, opcode_40, TFLIP, HIZ, TPARITY, ODDEVEN, RATE, SELFTEST, and ACLK division."
    expected: "TX digital symbols, parity, null/HIZ behavior, and busy timing match configured mode"
  - id: T-RX-FILTER
    requirement_id: REQ-RX-FILTER-001
    stimulus: "Inject RX words with SDI, label, priority, parity, and RFLIP variations."
    expected: "accepted FIFO words, rejected words, priority slot, and parity error indications match the spec model"
