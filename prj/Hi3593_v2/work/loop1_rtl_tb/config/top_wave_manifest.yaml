schema_version: 1
owner: Loop1 directed TB
purpose: Controlled DUT top-port waveform query manifest bound to active requirement tasks.
dut_scope: /loop1_tb/dut
waveform_format: vcd
dump_policy: top_ports_windowed
gate_policy: blocking
signal_source: active_verification_intent
task_binding_policy:
  required: true
  task_results: work/loop1_rtl_tb/current/log/loop1_task_results.jsonl
  check_results: work/loop1_rtl_tb/current/log/loop1_check_results.jsonl
  final_result_rule: TB_Result_AND_VCD_Result
vcd_parser:
  required: true
  engine: hdlflow_waveform_signal_rule_engine_v1
  actual_input_output_reconstruction: true
max_dump_duration: 100000000
max_file_size_mb: 50
clock:
  name: ACLK
  required: true
reset:
  name: MR
  active: high
  required: true
ports:
  -
    name: ACLK
    direction: input
    width: 1
    role: clock
    required: true
  -
    name: MR
    direction: input
    width: 1
    role: reset
    required: true
  -
    name: CS
    direction: input
    width: 1
    role: spi_chip_select
    required: true
  -
    name: SCK
    direction: input
    width: 1
    role: spi_clock
    required: true
  -
    name: SI
    direction: input
    width: 1
    role: spi_mosi
    required: true
  -
    name: SO
    direction: output
    width: 1
    role: spi_miso
    required: true
  -
    name: OUT1A
    direction: input
    width: 1
    role: arinc_rx1_a
    required: true
  -
    name: OUT1B
    direction: input
    width: 1
    role: arinc_rx1_b
    required: true
  -
    name: OUT2A
    direction: input
    width: 1
    role: arinc_rx2_a
    required: true
  -
    name: OUT2B
    direction: input
    width: 1
    role: arinc_rx2_b
    required: true
  -
    name: TX1IN
    direction: output
    width: 1
    role: arinc_tx_high
    required: true
  -
    name: TX0IN
    direction: output
    width: 1
    role: arinc_tx_low
    required: true
  -
    name: SLP
    direction: output
    width: 1
    role: arinc_driver_rate
    required: true
  -
    name: TEMPTY
    direction: output
    width: 1
    role: tx_fifo_empty
    required: true
  -
    name: TFULL
    direction: output
    width: 1
    role: tx_fifo_full
    required: true
  -
    name: R1FLAG
    direction: output
    width: 1
    role: rx1_flag
    required: true
  -
    name: R2FLAG
    direction: output
    width: 1
    role: rx2_flag
    required: true
  -
    name: R1INT
    direction: output
    width: 1
    role: rx1_interrupt
    required: true
  -
    name: R2INT
    direction: output
    width: 1
    role: rx2_interrupt
    required: true
windows:
  - name: reset_release
    linked_test_task: TASK_RESET_BASELINE_001
    requirement_id: REQ-RST-001
    checks:
      - required_ports_present
      - no_xz
      - clock_edges_present
      - non_clock_activity
  - name: spi_opcode_activity
    linked_test_task: TASK_OPCODE_MATRIX_001
    requirement_id: REQ-SPI-002
    checks:
      - required_ports_present
      - no_xz
      - clock_edges_present
      - input_event_exists
  - name: rx_location32_overwrite
    linked_test_task: TASK_RX_FIFO_OVERWRITE_001
    requirement_id: REQ-RX-001
    checks:
      - required_ports_present
      - no_xz
      - clock_edges_present
      - input_event_exists
      - output_response_exists
  - name: arinc_tx_response
    linked_test_task: TASK_TX_RESPONSE_001
    requirement_id: REQ-TX-001
    checks:
      - required_ports_present
      - no_xz
      - clock_edges_present
      - output_response_exists
