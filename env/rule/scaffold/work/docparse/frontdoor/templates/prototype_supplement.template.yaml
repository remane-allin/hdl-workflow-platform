schema_version: 1
project: change_me
template_type: prototype_supplement
intake_target: work/docparse/frontdoor/intake/pending
required_fields:
  - supplement_id
  - requirement_ids
  - external_interfaces
  - database_queries
  - fallback_mode
  - validation_modes
  - claim_policy
  - pin_level_validation_status
  - approval_status
example:
  supplement_id: PROTO-SUP-001
  requirement_ids:
    - REQ-NEW-001
  external_interfaces:
    - board connector, pin, UART, SPI, or GPIO boundary
  database_queries:
    - FPGA IO/schematic/tool command lookups required before script generation.
  fallback_mode: none_or_ps_pl_software_emulated
  validation_modes:
    - simulation
    - prototype_bringup
  claim_policy:
    may_claim_external_pin_level_validation: false
    may_claim_full_hardware_validation: false
  pin_level_validation_status: not_validated
  approval_status: pending
