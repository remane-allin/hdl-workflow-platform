schema_version: 1
workflow_id: six_agent_flow
purpose: isolated_spec_arch_exec_sim_review_arbtr_flow_before_and_across_loop_evidence
state_owner: work/memory/index.yaml
gate_owner: env/core/hdlflow/gates.py
roles:
  spec:
    title: Spec Agent
    owns: requirements, protocol text, metrics, executable chip spec, interface timing, legal design boundary, forbidden design list
    outputs:
      - work/docparse/frontdoor/srs.yaml
      - work/docparse/frontdoor/acceptance_criteria.yaml
      - work/docparse/frontdoor/forbidden_designs.yaml
      - work/docparse/structured_spec/interface_spec.yaml
      - work/docparse/structured_spec/interface_timing.yaml
      - work/docparse/structured_spec/timing_rules.yaml
      - work/docparse/req_decompose/requirements.json
  arch:
    title: Arch Agent
    owns: module topology, bus architecture, hierarchy partition, throughput plan, interface contracts, dataflow
    outputs:
      - work/docparse/architecture/module_plan.yaml
      - work/docparse/architecture/interface_contracts.yaml
      - work/docparse/architecture/dataflow.yaml
      - work/docparse/architecture/state_machines.yaml
      - work/docparse/architecture/timing_model.yaml
  exec:
    title: Exec Agent
    owns: Verilog RTL, instance relations, complete functional directed TB, combinational logic, sequential logic
    outputs:
      - output/rtl/
      - output/tb/
      - output/docs/test/verification_plan.md
  sim:
    title: Sim Agent
    owns: simulation stimulus, UVM, waveform comparison, logs, coverage, Loop1/Loop2/Loop3 validation evidence
    outputs:
      - work/docparse/verification/verification_plan.yaml
      - work/docparse/verification/assertion_plan.yaml
      - work/docparse/verification/coverage_plan.yaml
      - output/uvm/
      - output/reports/loop1/
      - output/reports/loop2/
      - output/reports/loop3/
  review:
    title: Review Agent
    owns: structured defect list, severity, lifecycle status, risk, correction advice, compliance review, root-cause routing
    outputs:
      - work/docparse/review/role_findings.yaml
      - output/reports/review/
  arbtr:
    title: Arbtr Agent
    owns: global log, disputes, version baseline, iteration count, correction routing, final freeze
    outputs:
      - work/docparse/review/decision_log.yaml
      - work/docparse/review/arbitration_log.yaml
      - work/memory/
      - work/gates/
      - output/reports/freeze/
handoff:
  spec_to_arch: Spec Agent releases executable spec, interface timing, and forbidden design boundaries.
  arch_to_exec: Arch Agent releases topology, module interfaces, hierarchy, and dataflow.
  exec_to_sim: Exec Agent releases compile-ready RTL and complete functional TB.
  sim_to_review: Sim Agent releases logs, coverage, wave anomalies, and pass/fail evidence.
  review_to_arbtr: Review Agent releases defect/risk status and correction recommendations.
  arbtr_feedback: Arbtr routes disagreement or defects back to spec, arch, exec, or sim; the flow reruns forward from that point.
