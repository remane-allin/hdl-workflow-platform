schema_version: 1
default_level: develop
final_required_level: release
gates:
  platform_change:
    required:
      - platform_pcr_gate
      - reduced_scope_policy_gate
      - impact_completeness_gate
      - template_schema_gate
      - regression_coverage_gate
      - migration_readiness_gate
      - arbtr_platform_review_gate
  entry:
    required:
      - work/change_state
      - project_config_valid
      - source_spec_available
      - expected_nodes_declared
  docparse_exit:
    required:
      - work/change_state
      - requirements_frontdoor_ready
      - frontdoor_template_readiness_gate
      - approved_intake_merge_gate
      - execution_lock_gate
      - trace_freshness_gate
      - machine_readable_specs_ready
      - review_findings_gate
      - docparse_extract_policy
      - docparse_no_ad_hoc_analysis_artifacts
      - project_local_loop_scripts_absent
      - forbidden_formal_text
      - design_doc_sync
      - structured_spec_available
      - requirement_decomposition_available
      - trace_matrix_available
  loop1_exit:
    required:
      - work/change_state
      - docparse_prerequisite_gate
      - design_doc_sync
      - review_findings_gate
      - project_local_loop_scripts_absent
      - forbidden_formal_text
      - rtl_semantic_stub_absent
      - rtl_compile_zero_error
      - directed_tb_regression_pass
      - loop1_deterministic_gate
      - loop1_task_requirement_evidence
      - loop1_waveform_blocking
      - no_open_critical_or_major_bug
      - requirement_trace_complete
    thresholds:
      line_coverage_percent: 80
      branch_coverage_percent: 70
  loop2_exit:
    required:
      - work/change_state
      - loop1_prerequisite_gate
      - design_doc_sync
      - review_findings_gate
      - project_local_loop_scripts_absent
      - forbidden_formal_text
      - rtl_semantic_stub_absent
      - uvm_compile_zero_error
      - uvm_regression_pass
      - zero_uvm_error
      - zero_uvm_fatal
      - loop2_independent_oracle
      - loop2_code_coverage
      - assertion_no_failure
      - bug_closure_pass
      - requirement_trace_complete
    thresholds:
      code_coverage_percent: 80
      functional_coverage_percent: 80
      requirement_coverage_percent: 100
  loop3_exit:
    required:
      - work/change_state
      - loop2_prerequisite_gate
      - design_doc_sync
      - review_findings_gate
      - project_local_loop_scripts_absent
      - forbidden_formal_text
      - rtl_semantic_stub_absent
      - database_preflight_report_available
      - loop3_validation_boundary_claim
      - prototype_plan_check_report_available
      - synthesis_or_implementation_pass
      - timing_report_available
      - board_test_report_available
  final:
    required:
      - work/change_state
      - all_stage_prerequisite_gates
      - design_doc_sync
      - review_findings_gate
      - project_local_loop_scripts_absent
      - forbidden_formal_text
      - all_enabled_nodes_passed
      - manifest_available
      - rtl_semantic_stub_absent
      - final_claim_gate
      - final_audit_report_available
