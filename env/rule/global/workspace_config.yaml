schema_version: 1
workspace: Test
policy:
  project_state_scope: project_local_only
  main_flow: linear_pipeline
  node_iteration: allowed
  cross_node_change_control: required
  output_write_policy: automated_or_signed_only
  runtime_cleanup_policy: disposable
paths:
  projects_root: prj
  templates_root: env/rule/scaffold
  archive_root: local/archive
  config_root: env/rule
  global_rules_root: env/rule/global
  project_configs_root: prj/*/work/config
  engine_root: env/core
inherits:
  project_config_name: project_config.yaml
  project_template: env/rule/scaffold
