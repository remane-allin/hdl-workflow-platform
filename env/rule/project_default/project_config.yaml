      vitis_platform_dir: output/fpga/vitis/platform
      vitis_apps_dir: output/fpga/vitis/apps
      vitis_reports_dir: output/fpga/vitis/reports
      loop3_report_dir: output/reports/loop3
      loop3_preflight_report_dir: output/reports/loop3/preflight
      loop3_serial_report_dir: output/reports/loop3/serial
      generated_xdc: output/fpga/vivado/constraints/generated_board.xdc
      generated_ps_pl_bd_tcl: output/fpga/vivado/scripts/generated_ps_pl_bd.tcl
      vitis_boot_dir: output/fpga/vitis/boot
      vivado_timing_report: output/fpga/vivado/reports/post_impl_timing_summary.rpt
      vivado_drc_report: output/fpga/vivado/reports/post_impl_drc.rpt
      vivado_implementation_report: output/reports/loop3/vivado_implementation_report.md
      vitis_boot_report: output/reports/loop3/vitis_boot_report.md
      board_validation_report: output/reports/loop3/board_validation_report.md
      loop3_exit_report: output/reports/loop3/loop3_exit_report.md
      serial_text_log: output/reports/loop3/serial/latest_serial_text.log
      xdc_clock_ports:
        - sys_clk=20.000
      xdc_generation: database_required
      bd_generation: database_ug_and_plan_required
      ps_pl_external_stimulus_boundary: required
      boot_image_generation: template_required
      resource_queries:
        pl:
          - PL_GCLK_50MHZ
          - PL_LED0
        ps_pl:
          - PS_KEY0
          - PS_LED1
          - DDR
          - PL_GCLK_50MHZ
          - PL_LED0
          - UART3_RX
          - UART3_TX
    evidence:
      reports:
        database_preflight: output/reports/loop3/preflight/database_preflight.md
        prototype_plan_check: output/reports/loop3/preflight/prototype_plan_check.md
        timing: output/fpga/vivado/reports/post_impl_timing_summary.rpt
        drc: output/fpga/vivado/reports/post_impl_drc.rpt
        serial: output/reports/loop3/serial/latest_serial_text.log
        serial_validation: output/reports/loop3/serial/latest_serial_validation_report.md
        vivado_implementation: output/reports/loop3/vivado_implementation_report.md
        vitis_boot: output/reports/loop3/vitis_boot_report.md
        board_validation: output/reports/loop3/board_validation_report.md
        loop3_exit: output/reports/loop3/loop3_exit_report.md
      globs:
        bitstreams: output/fpga/vivado/bitstream/*.bit
      required_markers:
        database_preflight_pass_any:
          - "result: PASS"
        prototype_plan_pass_any:
          - "result: PASS"
        timing_setup_all:
          - "Setup :"
          - "0  Failing Endpoints"
        timing_hold_all:
          - "Hold  :"
          - "0  Failing Endpoints"
        serial_echo_all:
          - "TX["
          - "RX["
      release_forbidden_markers:
        drc:
          - " Warning"
          - Warnings
          - "Checks found: 1"
        timing:
          - TIMING-18
          - "Missing input or output delay"
          - no_input_delay
          - no_output_delay
    gates:
      exit:
        - database_preflight_report_available
        - prototype_plan_check_report_available
        - implementation_report_available
        - loop3_validation_boundary_claim
        - timing_report_available
        - board_test_report_available
  output:
    inputs:
      loop1_reports: output/reports/loop1
      loop2_reports: output/reports/loop2
      loop3_reports: output/reports/loop3
    outputs:
      rtl: output/rtl
      tb: output/tb
      uvm: output/uvm
      fpga: output/fpga
      reports: output/reports
    evidence:
      reports:
        manifest: output/manifest.yaml
      required_markers:
        manifest:
          - "loop1_gate: PASS"
          - "loop2_gate: PASS"
          - "loop3_gate: PASS"
    gates:
      final:
        - all_enabled_nodes_passed
        - manifest_available
        - rtl_semantic_stub_absent
        - final_claim_gate
        - final_audit_report_available
versioning:
  tag_on_final_gate_pass: false
  record_tool_versions: true
  record_skill_versions: true
archive:
  project_archive: _archive
  runtime_cleanup_after_pass: true
