[project]
name = "hdl-workflow-platform"
version = "0.1.0"
description = "Local HDL workflow platform for RTL, UVM, and FPGA prototype projects."
requires-python = ">=3.11"
dependencies = [
    "pywellen==0.25.5; python_version < '3.14' or platform_system != 'Windows'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "env/core"}
packages = ["hdlflow"]

[tool.hdlflow]
supported_os = ["Windows", "Linux"]
primary_cli = "python -m hdlflow.cli"
project_create = "python env/tool/scripts/new_hdl_project.py <name>"
